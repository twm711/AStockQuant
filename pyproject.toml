[project]
name = "astockquant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic-settings>=2.5", "pandas>=2.2", "numpy>=1.26", "duckdb>=1.1", "SQLAlchemy>=2.0"]
[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
exclude = ["frontend/node_modules"]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
